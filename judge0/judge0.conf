# Minimal configuration for the Judge0 reference setup. CHANGE THE PASSWORDS before exposing the service anywhere.
REDIS_HOST=redis
REDIS_PASSWORD=change-me-redis

POSTGRES_HOST=db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=change-me-postgres

# Return the result in the same HTTP call (the application uses ?wait=true and falls back to polling if it is off).
ENABLE_WAIT_RESULT=true

# Optional: require a token on every request. Then start the backend with JUDGE0_AUTH_TOKEN set to the same value.
# AUTHN_HEADER=X-Auth-Token
# AUTHN_TOKEN=change-me-token

# Limits (the application asks for a 2 second CPU limit per test).
MAX_CPU_TIME_LIMIT=5
MAX_WALL_TIME_LIMIT=15
