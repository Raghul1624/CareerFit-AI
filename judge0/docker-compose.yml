# Self-hosted Judge0 CE: the sandbox that runs the code of the Coding Round.
# REFERENCE SETUP - it follows the official Judge0 CE 1.13.1 deployment, but it was NOT run while building this project.
#
#   cd judge0
#   docker compose up -d            (first start downloads the images and can take a few minutes)
#   then start the backend with:    JUDGE0_URL=http://localhost:2358
#
# Requirements: Linux or Docker Desktop with the WSL 2 backend. Judge0 CE 1.13.1 isolates code with `isolate`, which needs
# cgroup v1; on a host that only has cgroup v2 the workers fail. See https://github.com/judge0/judge0/blob/master/CHANGELOG.md
# and the README of this project for alternatives (Judge0 on RapidAPI, or a hosted Judge0).
services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: unless-stopped
    depends_on: [db, redis]

  worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    depends_on: [db, redis]

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data/
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    restart: unless-stopped

volumes:
  judge0-data:
