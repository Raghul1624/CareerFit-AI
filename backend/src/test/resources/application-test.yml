spring:
  datasource:
    url: jdbc:h2:mem:careerfit;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
app:
  jwt:
    secret: test-secret-test-secret-test-secret-123456
    expiration-minutes: 30
  cors:
    allowed-origins: http://localhost:5173
  admin:
    email: ""
    password: ""
  storage:
    resume-dir: ${java.io.tmpdir}/careerfit-test-resumes
  resume:
    max-bytes: 2097152
    max-pages: 10
    max-per-user: 5
