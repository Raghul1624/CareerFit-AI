spring:
  application:
    name: careerfit-ai
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/careerfit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is managed ONLY by Flyway migrations
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET}                       # required, at least 32 characters
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:}                      # optional: creates an admin account on startup
    password: ${ADMIN_PASSWORD:}
  storage:
    resume-dir: ${RESUME_STORAGE_DIR:./data/resumes}   # private directory, never served over HTTP
  resume:
    max-bytes: 2097152
    max-pages: 10
    max-per-user: 5
  coding:                                       # Submitted code runs only in OnlineCompiler's isolated external sandbox
    onlinecompiler:
      api-key: ${ONLINECOMPILER_API_KEY:}        # blank disables code execution; never commit the key
      java-compiler: ${ONLINECOMPILER_JAVA_COMPILER:openjdk-25}
      python-compiler: ${ONLINECOMPILER_PYTHON_COMPILER:python-3.14}
      javascript-compiler: ${ONLINECOMPILER_JAVASCRIPT_COMPILER:nodejs-24}
      connect-timeout-ms: 5000
      read-timeout-ms: 40000
    max-source-chars: 10000
    max-stdin-chars: 4000
    max-submissions-per-problem: 40
